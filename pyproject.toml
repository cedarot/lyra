[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "0.1.0"
description = "A multi-site song search and authorized lyrics/audio downloader CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lyra contributors" }]
dependencies = ["beautifulsoup4>=4.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lyra = "lyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
